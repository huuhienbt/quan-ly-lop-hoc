import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Gradle resolves the pinned test SDKs through its configured proxy/cache. The
// offline Robolectric resolver avoids writing a download lock in the user's home.
configurations {
    robolectricSdk26 { transitive = false }
    robolectricSdk36 { transitive = false }
}
def robolectricSdkDir = layout.buildDirectory.dir('robolectric-sdks')
tasks.register('prepareRobolectricSdks', Copy) {
    from configurations.robolectricSdk26, configurations.robolectricSdk36
    into robolectricSdkDir
}

// Only an external private file can enable release signing. No signing values are
// committed, put in the APK, or sent to the website.
def signingPath = providers.environmentVariable('ECLASS_ANDROID_SIGNING_FILE').orNull
def signingData = signingPath ? new JsonSlurper().parse(new File(signingPath)) : null
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && signingData == null) {
    throw new GradleException('Set ECLASS_ANDROID_SIGNING_FILE to the private signing JSON before building a release.')
}
// Generic `build` or `assemble` also includes release outputs. Check the resolved
// graph as well so those commands cannot silently emit an unsigned release.
gradle.taskGraph.whenReady { graph ->
    if (signingData == null && graph.allTasks.any {
        it.project == project && it.name in ['assembleRelease', 'packageRelease', 'bundleRelease', 'packageReleaseBundle']
    }) {
        throw new GradleException('Release output requires ECLASS_ANDROID_SIGNING_FILE; unsigned release output is disabled.')
    }
}

android {
    namespace 'vn.edu.bentre.eclass'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'vn.edu.bentre.eclass'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        if (signingData != null) {
            release {
                storeFile file(signingData.storeFile)
                storePassword signingData.storePassword
                keyAlias signingData.keyAlias
                keyPassword signingData.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingData != null) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn 'prepareRobolectricSdks'
            maxParallelForks = 1
            maxHeapSize = '1024m'
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED'
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', robolectricSdkDir.get().asFile.absolutePath
            // Keep the managed environment's proxy and CA trust in the test JVM.
            ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort',
             'http.nonProxyHosts', 'javax.net.ssl.trustStore'].each { name ->
                if (System.getProperty(name)) systemProperty name, System.getProperty(name)
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    // Match @Config(sdk = {26, 36}) and Robolectric 4.17's SDK catalog.
    robolectricSdk26 'org.robolectric:android-all-instrumented:8.0.0_r4-robolectric-r1-i7'
    robolectricSdk36 'org.robolectric:android-all-instrumented:16-robolectric-13921718-i7'
}
